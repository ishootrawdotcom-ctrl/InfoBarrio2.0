<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050811" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>InfoBarrio // Radar Urbano en Tiempo Real</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=23" />
</head>
<body>
  <div id="map"></div>
  <div class="hud-scanlines" aria-hidden="true"></div>

  <!-- Cabecera Flotante -->
  <header class="mobile-topbar glass-panel">
    <div class="brand">
      <div class="pulse-dot"></div>
      <div class="brand-text">
        <div class="brand-title-row">
          <h1>INFOBARRIO</h1>
          <span class="badge-beta">REAL DATA</span>
        </div>
        <p id="status-text" class="mono-text">CONECTANDO GPS...</p>
      </div>
    </div>
    <span id="scan-source-badge" class="source-tag mono-text">LISTO</span>
  </header>

  <!-- Botones Flotantes Derecha -->
  <div class="map-fab-stack">
    <button id="btn-theme" class="fab-btn glass-panel" title="Modo Día / Noche" aria-label="Cambiar tema">
      <span id="theme-icon">☀️</span>
    </button>
    <button id="btn-gps" class="fab-btn primary glass-panel" title="Mi ubicación GPS real" aria-label="Mi GPS">
      <span>🎯</span>
    </button>
    <button id="btn-valencia" class="fab-btn glass-panel" title="Probar en Valencia Centro / El Viñedo" aria-label="Valencia">
      <span class="fab-label">VE</span>
    </button>
  </div>

  <!-- Hoja Inferior Deslizable -->
  <section id="bottom-sheet" class="bottom-sheet glass-panel state-half">
    <div id="sheet-drag-zone" class="sheet-drag-zone">
      <div class="drag-pill" aria-hidden="true"></div>
      <div class="sheet-header-row">
        <div class="sheet-title-wrap" id="sheet-tap-toggle">
          <span class="section-label mono-text">RADAR REAL • <span id="active-radius-label">1 km</span></span>
          <h2><span id="count-display">0</span> Locales Reales</h2>
        </div>
        <button id="btn-scan-mini" class="mini-scan-btn" aria-label="Escanear ahora">
          <span class="scan-spinner"></span>
          <span class="mini-scan-label">⚡ Escanear</span>
        </button>
      </div>
    </div>

    <div class="sheet-scroll" id="sheet-scroll">
      <div class="telemetry-strip mono-text">
        <span>📡 <strong id="coords-display">---, ---</strong></span>
        <span id="gps-accuracy-pill" class="acc-pill">RADAR ACTIVO</span>
      </div>

      <!-- Radio de Escaneo -->
      <div class="control-block">
        <span class="control-label mono-text">RADIO DE BÚSQUEDA</span>
        <div class="radius-pills">
          <button class="pill" data-radius="500">500 m</button>
          <button class="pill active" data-radius="1000">1 km</button>
          <button class="pill" data-radius="2000">2 km</button>
          <button class="pill" data-radius="5000">5 km</button>
        </div>
      </div>

      <!-- Filtros Reales -->
      <div class="control-block">
        <span class="control-label mono-text">CATEGORÍA</span>
        <div class="filter-chips" id="filter-chips">
          <button class="chip active" data-filter="all">Todos</button>
          <button class="chip" data-filter="restaurant">🍽️ Restaurantes</button>
          <button class="chip" data-filter="fast_food">🍔 Comida Rápida</button>
          <button class="chip" data-filter="shop">🥐 Panaderías / Tiendas</button>
          <button class="chip" data-filter="cafe">☕ Cafés</button>
          <button class="chip social-chip" data-filter="social">📸 Con Redes / Web</button>
        </div>
      </div>

      <button id="btn-scan" class="scan-action-btn">
        <span class="scan-spinner"></span>
        <span id="scan-btn-text">⚡ ESCANEAR LOCALES REALES</span>
      </button>

      <div id="results-list" class="results-list">
        <div class="empty-state">
          Pulsa <strong>ESCANEAR LOCALES REALES</strong> para buscar comercios registrados en el mapa alrededor tuyo.
        </div>
      </div>
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
